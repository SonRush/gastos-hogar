name: Migrar base de datos
# Ejecuta manualmente un archivo de migrations/ contra la base remota gastos-db.
on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Archivo dentro de migrations/ (ej. 0004_ids_bot.sql)"
        required: true

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar nombre de archivo
        env:
          ARCHIVO: ${{ inputs.archivo }}
        run: |
          [[ "$ARCHIVO" =~ ^[0-9]{4}_[a-z_]+\.sql$ ]] || { echo "Nombre invalido"; exit 1; }
          test -f "migrations/$ARCHIVO"
      - name: Ejecutar
        env:
          ARCHIVO: ${{ inputs.archivo }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute gastos-db --remote --yes --file "migrations/$ARCHIVO"
