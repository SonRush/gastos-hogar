name = "gastos-app"
main = "src/app.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Se llenan al activar Cloudflare Access (no son secretos). Vacios = la app rechaza todo.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "gastos-db"
database_id = "9090dfef-237b-4b53-850b-cdd3b0232fdf"

[[r2_buckets]]
binding = "TICKETS"
bucket_name = "gastos-tickets"

[observability]
enabled = true
